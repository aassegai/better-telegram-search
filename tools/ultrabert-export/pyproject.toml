[project]
name = "telegram-search-ultrabert-export"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==5.21.0",
  "onnx==1.19.1",
  "onnxruntime==1.30.0",
  "numpy==2.5.3",
  "protobuf>=4.25,<7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
