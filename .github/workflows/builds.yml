name: Portable builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'bundle/**'
      - 'scripts/build_app.py'
      - 'scripts/report_builds.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/builds.yml'
permissions:
  contents: read
concurrency:
  group: portable-builds-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repository.py
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - id: version
        name: Read the project version for native builds
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError("Native releases require a numeric project version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
              out.write(f"version={version}\n")
          PY
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BTS_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="build-${BTS_BUILD_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="docs/releases/${BTS_BUILD_VERSION}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/native-notes.md"
            printf "### What's new\n\nNative builds for %s.\n" "$BTS_BUILD_VERSION" > "$notes"
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Native builds $BTS_BUILD_VERSION ($GITHUB_RUN_NUMBER)" \
            --notes-file "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          BTS_RELEASE_TAG="$tag" BTS_BUILD_RESULT=pending python3 scripts/report_builds.py
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            name: linux-x86_64
            extra: semantic
            variant: cpu
          - os: ubuntu-22.04-arm
            arch: arm64
            name: linux-arm64
            extra: semantic
            variant: cpu
          - os: windows-2022
            arch: x86_64
            name: win32-x86_64
            extra: semantic
            variant: cpu
          - os: macos-15
            arch: arm64
            name: darwin-arm64
            extra: semantic
            variant: cpu
          - os: macos-15-intel
            arch: x86_64
            name: darwin-x86_64
            extra: semantic
            variant: cpu
          - os: ubuntu-22.04
            arch: x86_64
            name: linux-x86_64-gpu
            extra: gpu
            variant: gpu
          - os: windows-2022
            arch: x86_64
            name: win32-x86_64-gpu
            extra: gpu
            variant: gpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      UV_PROJECT_ENVIRONMENT: workspace/build-env
      BTS_RUNTIME_EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev --group bundle --extra '${{ matrix.extra }}' --extra ocr --python 3.12 --python-preference only-managed
      - run: npm ci
        working-directory: frontend
      - name: Build and verify the extracted native archive
        shell: bash
        env:
          BTS_EXPECTED_ARCH: ${{ matrix.arch }}
          BTS_BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            workspace/build-env/Scripts/python.exe scripts/build_app.py --expected-arch "$BTS_EXPECTED_ARCH" --variant "$BTS_BUILD_VARIANT"
          else
            workspace/build-env/bin/python scripts/build_app.py --expected-arch "$BTS_EXPECTED_ARCH" --variant "$BTS_BUILD_VARIANT"
          fi
      - name: Stage verified packages in the unpublished release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BTS_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$BTS_RELEASE_TAG" artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: artifacts/*.json
          retention-days: 3
          if-no-files-found: error
  report:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: build-reports
          merge-multiple: true
      - name: Record statuses and download links
        env:
          GH_TOKEN: ${{ github.token }}
          BTS_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BTS_BUILD_RESULT: ${{ needs.build.result }}
        run: python3 scripts/report_builds.py
