name: Adapter portability
on:
  workflow_dispatch:
  push:
    branches: ['next/model-adapters']
    paths:
      - 'src/telegram_search/model_adapters/**'
      - 'src/telegram_search/distribution/**'
      - 'bundle/**'
      - 'scripts/build_app.py'
      - '.github/workflows/adapters.yml'
permissions:
  contents: read
jobs:
  windows-native:
    if: github.ref == 'refs/heads/next/model-adapters'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: workspace/adapter-native-env
      BTS_RUNTIME_EXTRA: semantic
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev --group bundle --extra semantic --extra ocr --extra telegram --python 3.12 --python-preference only-managed
      - run: npm ci
        working-directory: frontend
      - name: Build and verify the extracted Windows application
        shell: python
        run: |
          import re
          import subprocess
          import sys
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          try:
              result = subprocess.run(
                  ['uv', 'run', '--no-sync', 'python', 'scripts/build_app.py',
                   '--expected-arch', 'x86_64', '--variant', 'cpu'],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
          except Exception as exc:
              print('::error title=Native build runner::' + type(exc).__name__)
              raise
          output = result.stdout.decode('utf-8', errors='replace')
          if result.returncode:
              phases = re.findall(r'Adapter startup: ([a-z_]{1,32})', output)
              stage = phases[-1] if phases else 'not_recorded'
              print('::error title=Custom adapter native smoke::Startup stage: ' + stage)
              operations = re.findall(r'Adapter operation: ([a-z_]{1,32})', output)
              operation = operations[-1] if operations else 'not_recorded'
              print('::error title=Custom adapter native smoke::Operation: ' + operation)
              failures = re.findall(r'Adapter failure: ([a-z_]{1,32})', output)
              failure = failures[-1] if failures else 'not_recorded'
              print('::error title=Custom adapter native smoke::Failure category: ' + failure)
              transports = re.findall(r'Adapter transport: ([a-z_]{1,32})', output)
              transport = transports[-1] if transports else 'not_recorded'
              print('::error title=Custom adapter native smoke::Transport: ' + transport)
              reason = next((code for code, phrase in [
                  ('timeout', 'Custom model timed out;'),
                  ('worker_failed', 'Custom model worker failed.'),
                  ('operation_failed', 'Custom model operation failed.'),
                  ('invalid_response', 'Custom model worker returned an invalid response.'),
                  ('capabilities', 'Custom model capabilities'),
              ] if phrase in output), 'not_recorded')
              print('::error title=Custom adapter native smoke::Failure reason: ' + reason)
          print(output)
          sys.exit(result.returncode)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-adapter-smoke
          path: artifacts/*.json
          retention-days: 3
