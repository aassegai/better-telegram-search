name: Update explicitly requested release notes
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a checked-in notes request
        required: true
        default: '0.1.1'
  push:
    branches: [main]
    paths:
      - '.github/release-notes/*.json'
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  update-notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Apply the explicitly requested release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          BTS_RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --no-project --python 3.12 python scripts/update_release_notes.py
