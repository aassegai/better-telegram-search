[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "better-telegram-search"
version = "0.1.0"
description = "Local CPU search for Telegram Desktop exports with ONNX semantic inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "ijson>=3.3,<4",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "filelock>=3.16,<4",
]

[project.scripts]
telegram-search = "telegram_search.cli:main"

[project.optional-dependencies]
semantic = [
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.34,<2",
  "lancedb>=0.25,<1",
  "pyarrow>=18,<30",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
