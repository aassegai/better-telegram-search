[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "better-telegram-search"
version = "0.3.8"
description = "Local search for Telegram Desktop exports with ONNX CPU and GPU inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "ijson>=3.3,<4",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "filelock>=3.16,<4",
]

[project.scripts]
telegram-search = "telegram_search.cli:main"

[project.optional-dependencies]
semantic = [
  "onnxruntime>=1.20,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "tokenizers>=0.21,<1",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.34,<2",
  "lancedb>=0.25,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "lancedb==0.25.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyarrow>=18,<30",
  "safetensors>=0.5,<1",
]
ocr = [
  "tesserocr>=2.11,<3",
  "opencv-python-headless>=4.11,<5",
  "pyclipper>=1.3,<2",
  "cysignals>=1.12.6,<2; sys_platform != 'win32' and python_version >= '3.12'",
]
gpu = [
  "onnxruntime-gpu[cuda,cudnn]==1.23.2; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  "tokenizers>=0.21,<1",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.34,<2",
  "lancedb>=0.25,<1",
  "pyarrow>=18,<30",
  "safetensors>=0.5,<1",
]

[tool.uv]
conflicts = [[{ extra = "semantic" }, { extra = "gpu" }]]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
bundle = ["pyinstaller==6.22.3"]

# Upstream's Windows wheels include Tesseract and Leptonica; PyPI has no Windows wheel.
[tool.uv.sources]
tesserocr = [
  { url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.11.0-tesseract-5.5.3/tesserocr-2.11.0-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.11'" },
  { url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.11.0-tesseract-5.5.3/tesserocr-2.11.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
  { url = "https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.11.0-tesseract-5.5.3/tesserocr-2.11.0-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
